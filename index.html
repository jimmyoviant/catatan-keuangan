<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Catatan Keuangan Offline AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#111827;color:white}
.app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1,h2,h3{margin:0 0 8px}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 12px #0000000d}.stat{font-size:24px;font-weight:800}.green{color:#15803d}.red{color:#b91c1c}.blue{color:#1d4ed8}.orange{color:#c2410c}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}nav button{background:white;color:#374151;border:1px solid #e5e7eb;white-space:nowrap}nav button.active{background:#111827;color:white}
.ai{background:linear-gradient(135deg,#111827,#374151);color:white}.ai input{width:100%;padding:14px;border-radius:12px;border:1px solid #4b5563;background:#1f2937;color:white;outline:0}.ai .row{display:flex;gap:8px;margin-top:10px}.ai button{background:white;color:#111827}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:14px}th{color:#6b7280;font-size:12px}
.badge{padding:4px 8px;border-radius:99px;background:#f3f4f6;font-size:12px}.empty{text-align:center;padding:30px;color:#9ca3af}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#111827}
.item{padding:12px;border:1px solid #eee;border-radius:12px;margin:8px 0}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#e5e7eb;color:#111827}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.app{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>💰 Catatan Keuangan</h1><div class="muted">Offline • data tersimpan di perangkat</div></div>
    <div class="row"><button onclick="backup()">Backup</button><button class="secondary" onclick="restoreFile()">Restore</button><input id="restore" type="file" accept=".json" hidden></div>
  </div>

  <nav id="nav">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="transaksi">Transaksi</button>
    <button data-tab="mingguan">Mingguan</button>
    <button data-tab="bulanan">Bulanan</button>
    <button data-tab="darurat">Dana Darurat</button>
    <button data-tab="tabungan">Tabungan</button>
  </nav>

  <section class="card ai">
    <h2>🤖 Input dengan AI Offline</h2>
    <div class="muted" style="color:#d1d5db">Contoh: “tadi makan 25 ribu”, “gaji masuk 7 juta”, “simpan 500 ribu ke dana darurat”, atau beberapa transaksi sekaligus.</div>
    <div class="row" style="margin-top:10px"><input id="aiInput" placeholder="Ketik transaksi dengan bahasa sehari-hari..."><button onclick="parseAI()">Analisis</button></div>
    <div id="aiPreview"></div>
  </section>

  <main id="content" style="margin-top:14px"></main>
</div>

<script>
const DB='keuangan_offline_ai_v1', STORE='data';
let state={transactions:[],goals:[],settings:{emergencyTarget:10000000}};
let tab='dashboard';

const cats=['Makanan','Transportasi','Belanja','Tagihan','Kesehatan','Pendidikan','Hiburan','Rumah','Gaji','Bonus','Lainnya'];
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){let d=await db();return new Promise((res,rej)=>{let t=d.transaction(STORE,'readonly').objectStore(STORE).get('state');t.onsuccess=()=>res(t.result||state);t.onerror=()=>rej(t.error)})}
async function save(){let d=await db();return new Promise((res,rej)=>{let t=d.transaction(STORE,'readwrite').objectStore(STORE).put(state,'state');t.onsuccess=()=>{bc?.postMessage({type:'update'});res()};t.onerror=()=>rej(t.error)})}
const bc='BroadcastChannel' in window?new BroadcastChannel('keuangan-sync'):null;
bc&&(bc.onmessage=async e=>{if(e.data?.type==='update'){state=await load();render()}});

function sum(type,from,to){return state.transactions.filter(x=>x.date>=from&&x.date<=to&&(type?x.type===type:true)).reduce((a,x)=>a+x.amount,0)}
function monthRange(){let d=new Date(), y=d.getFullYear(),m=d.getMonth();return [`${y}-${String(m+1).padStart(2,'0')}-01`,`${y}-${String(m+1).padStart(2,'0')}-${new Date(y,m+1,0).getDate()}`]}
function weekRange(){let d=new Date();let day=d.getDay()||7;let s=new Date(d);s.setDate(d.getDate()-day+1);let e=new Date(s);e.setDate(s.getDate()+6);return [s.toISOString().slice(0,10),e.toISOString().slice(0,10)]}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('content').innerHTML=views[tab]();}

const views={
dashboard(){let [a,b]=monthRange(), income=sum('income',a,b), expense=sum('expense',a,b), savings=state.transactions.filter(x=>x.type==='saving').reduce((s,x)=>s+x.amount,0), emergency=state.transactions.filter(x=>x.type==='emergency').reduce((s,x)=>s+x.amount,0);return `<div class="grid">
<div class="card"><div class="muted">Pemasukan bulan ini</div><div class="stat green">${money(income)}</div></div>
<div class="card"><div class="muted">Pengeluaran bulan ini</div><div class="stat red">${money(expense)}</div></div>
<div class="card"><div class="muted">Tabungan</div><div class="stat blue">${money(savings)}</div></div>
<div class="card"><div class="muted">Dana darurat</div><div class="stat orange">${money(emergency)}</div></div>
</div><div class="two" style="margin-top:12px"><div class="card"><h3>Ringkasan</h3><p>Selisih bulan ini: <b>${money(income-expense)}</b></p><p>Total transaksi: <b>${state.transactions.length}</b></p></div><div class="card"><h3>Transaksi terbaru</h3>${list(state.transactions.slice().sort((x,y)=>y.created-x.created).slice(0,5))}</div></div>`},
transaksi(){return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Semua Transaksi</h2><button onclick="manual()">+ Tambah</button></div>${list(state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created),true)}</div>`},
mingguan(){let [a,b]=weekRange();return period('Minggu ini',a,b)},
bulanan(){let [a,b]=monthRange();return period('Bulan ini',a,b)},
darurat(){let total=state.transactions.filter(x=>x.type==='emergency').reduce((s,x)=>s+x.amount,0), target=state.settings.emergencyTarget||10000000, p=Math.min(100,total/target*100);return `<div class="card"><h2>🆘 Dana Darurat</h2><p>Target: ${money(target)} • Terkumpul: <b>${money(total)}</b></p><div class="progress"><div style="width:${p}%"></div></div><p>${p.toFixed(1)}% tercapai</p><div class="row"><button onclick="addFund('emergency')">+ Tambah Dana</button><button class="secondary" onclick="setTarget()">Atur Target</button></div></div>`},
tabungan(){let total=state.transactions.filter(x=>x.type==='saving').reduce((s,x)=>s+x.amount,0);return `<div class="card"><h2>🏦 Tabungan</h2><p>Total tabungan: <b>${money(total)}</b></p>${state.goals.length?state.goals.map(g=>{let v=state.transactions.filter(x=>x.type==='saving'&&x.goal===g.id).reduce((s,x)=>s+x.amount,0),p=Math.min(100,v/g.target*100);return `<div class="item"><b>${esc(g.name)}</b><div class="muted">${money(v)} / ${money(g.target)}</div><div class="progress"><div style="width:${p}%"></div></div></div>`}).join(''):'<div class="empty">Belum ada target tabungan.</div>'}<button onclick="newGoal()">+ Target Tabungan</button></div>`}
};
function period(title,a,b){let inc=sum('income',a,b),exp=sum('expense',a,b);let rows=state.transactions.filter(x=>x.date>=a&&x.date<=b);let by={};rows.filter(x=>x.type==='expense').forEach(x=>by[x.category]=(by[x.category]||0)+x.amount);return `<div class="grid"><div class="card"><div class="muted">${title}</div><div class="stat">${money(inc-exp)}</div></div><div class="card"><div class="muted">Pemasukan</div><div class="stat green">${money(inc)}</div></div><div class="card"><div class="muted">Pengeluaran</div><div class="stat red">${money(exp)}</div></div><div class="card"><div class="muted">Transaksi</div><div class="stat">${rows.length}</div></div></div><div class="two" style="margin-top:12px"><div class="card"><h3>Kategori pengeluaran</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="justify-content:space-between;padding:8px 0"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">Belum ada.</div>'}</div><div class="card"><h3>Transaksi</h3>${list(rows)}</div></div>`}
function list(arr,actions=false){if(!arr.length)return '<div class="empty">Belum ada transaksi.</div>';return `<table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th>${actions?'<th></th>':''}</tr></thead><tbody>${arr.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><span class="badge">${labelType(x.type)}</span></td><td>${esc(x.category||'-')}</td><td class="${x.type==='expense'?'red':'green'}">${x.type==='expense'?'-':'+'}${money(x.amount)}</td>${actions?`<td><button class="danger" onclick="del('${x.id}')">Hapus</button></td>`:''}</tr>`).join('')}</tbody></table>`}
function labelType(t){return {income:'Pemasukan',expense:'Pengeluaran',saving:'Tabungan',emergency:'Dana Darurat'}[t]||t}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function parseAmount(s){s=s.toLowerCase().replace(/\s/g,'').replace(/\./g,'').replace(/,/g,'.');let m=s.match(/(\d+(?:\.\d+)?)(juta|jt|ribu|rb|k)?/);if(!m)return 0;let n=parseFloat(m[1]);if(['juta','jt'].includes(m[2]))n*=1e6;else if(['ribu','rb','k'].includes(m[2]))n*=1e3;return Math.round(n)}
function parseAI(){
 let raw=document.getElementById('aiInput').value.trim();if(!raw)return;
 let parts=raw.split(/\s*(?:,| dan | lalu | kemudian |;)\s*/i).filter(Boolean), out=[];
 for(let p of parts){let amount=parseAmount(p);if(!amount)continue;let low=p.toLowerCase();let type=/gaji|bonus|pendapatan|masuk|diterima|transfer masuk/.test(low)?'income':/tabungan|nabung|simpan ke tabungan/.test(low)?'saving':/dana darurat|darurat/.test(low)?'emergency':'expense';let category=type==='income'?'Gaji':type==='saving'?'Tabungan':type==='emergency'?'Dana Darurat':/makan|kopi|minum|resto|kuliner/.test(low)?'Makanan':/bensin|bbm|parkir|ojek|grab|gojek|transport/.test(low)?'Transportasi':/pulsa|listrik|internet|tagihan/.test(low)?'Tagihan':/obat|dokter|rumah sakit/.test(low)?'Kesehatan':/belanja|baju|sepatu/.test(low)?'Belanja':'Lainnya';out.push({raw:p,amount,type,category,date:today()})}
 if(!out.length){document.getElementById('aiPreview').innerHTML='<p style="color:#fecaca">Nominal belum terbaca. Contoh: “makan 25 ribu”.</p>';return}
 window.pendingAI=out;document.getElementById('aiPreview').innerHTML=`<div class="card" style="margin-top:12px;color:#111827">${out.map(x=>`<div class="item"><b>${labelType(x.type)}</b> • ${esc(x.category)} • ${money(x.amount)}<br><span class="muted">${esc(x.raw)}</span></div>`).join('')}<button onclick="confirmAI()">✓ Simpan semua</button></div>`;
}
async function confirmAI(){for(let x of window.pendingAI||[])state.transactions.push({id:uid(),created:Date.now(),...x});window.pendingAI=[];document.getElementById('aiInput').value='';document.getElementById('aiPreview').innerHTML='';await save();render()}
async function del(id){if(confirm('Hapus transaksi ini?')){state.transactions=state.transactions.filter(x=>x.id!==id);await save();render()}}
function manual(){let amount=prompt('Nominal (contoh 25000):');if(!amount)return;let type=prompt('Jenis: expense / income / saving / emergency','expense');let category=prompt('Kategori','Lainnya');state.transactions.push({id:uid(),created:Date.now(),date:today(),amount:Number(amount),type,category});save().then(render)}
function addFund(type){let n=prompt('Nominal:');if(!n)return;state.transactions.push({id:uid(),created:Date.now(),date:today(),amount:Number(n),type,category:type==='emergency'?'Dana Darurat':'Tabungan'});save().then(render)}
function setTarget(){let n=prompt('Target dana darurat:',state.settings.emergencyTarget);if(n){state.settings.emergencyTarget=Number(n);save().then(render)}}
function newGoal(){let name=prompt('Nama target (contoh: Rumah):');if(!name)return;let target=prompt('Target nominal:');if(!target)return;state.goals.push({id:uid(),name,target:Number(target)});save().then(render)}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-keuangan-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreFile(){document.getElementById('restore').click()}
document.getElementById('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x.transactions)throw 0;state=x;await save();render();alert('Restore berhasil.')}catch{alert('File backup tidak valid.')}};r.readAsText(f)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
(async()=>{state=await load();render()})();
</script>
</body>
</html>
